<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunny Travel Online v2.0</title><style>
:root{font-family:system-ui,Arial;color:#202124;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}header{background:#161616;color:#f5c400;padding:16px 24px;font-size:22px;font-weight:800}main{max-width:1150px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #e1e4e9;border-radius:12px;padding:20px;margin:16px 0}input,select,button{padding:10px 12px;border:1px solid #cdd2d8;border-radius:8px;font:inherit;max-width:100%}button{cursor:pointer;background:#f5c400;border:0;font-weight:700}button.secondary{background:#f2f2f2}form{display:flex;flex-wrap:wrap;gap:10px;align-items:end}label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid #e5e7eb;padding:10px;text-align:left}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{background:#eee}nav button.active{background:#f5c400}.muted{color:#6b7280;font-size:13px}.error{color:#b42318}.ok{color:#12834b}h2{margin-top:0}#app{display:none} .scroll{overflow:auto} .stats{display:flex;gap:14px;flex-wrap:wrap}.stats div{background:#f7f8f9;padding:16px;border-radius:10px;min-width:180px}.stats b{display:block;font-size:20px;margin-top:8px}
</style><header>SUNNY <small style="color:#aaa;font-size:12px">TRAVEL TICKET MANAGEMENT · ONLINE v2.0 FOUNDATION</small></header><main><div id="notice" role="status"></div><section id="auth" class="card"><h2>Đăng nhập Sunny Travel</h2><p class="muted">Lần đầu chạy: tạo tài khoản quản trị viên. Mật khẩu tối thiểu 12 ký tự.</p><form id="authform"><label>Tài khoản<input name="username" required minlength="3"></label><label>Mật khẩu<input name="password" type="password" required minlength="12"></label><button id="authbtn">Đăng nhập</button></form></section><section id="app"><div class="card"><nav id="nav"></nav><p id="who" class="muted"></p><button class="secondary" onclick="logout()">Đăng xuất</button></div><div id="page"></div></section></main><script>
const $=id=>document.getElementById(id);let me=null,agents=[],tickets=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('vi-VN')+' đ';const today=()=>new Date().toLocaleDateString('en-CA');
async function api(path,opt={}){const r=await fetch('/api/'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'Có lỗi xảy ra');return data}
function msg(s,bad=false){$('notice').innerHTML='<p class="'+(bad?'error':'ok')+'">'+esc(s)+'</p>'}function values(f){return Object.fromEntries(new FormData(f).entries())}async function send(path,body){try{await api(path,{method:'POST',body:JSON.stringify(body)});msg('Đã lưu thành công');await show(window.currentTab||'booking')}catch(e){msg(e.message,true)}}
async function boot(){const s=await api('setup-status');$('authbtn').textContent=s.setup_required?'Tạo quản trị viên':'Đăng nhập';$('authform').onsubmit=async e=>{e.preventDefault();try{const v=values(e.target);await api(s.setup_required?'setup':'login',{method:'POST',body:JSON.stringify(v)});if(s.setup_required){msg('Đã tạo quản trị viên. Đăng nhập để tiếp tục.');$('authbtn').textContent='Đăng nhập';$('authform').onsubmit=async ev=>{ev.preventDefault();try{await api('login',{method:'POST',body:JSON.stringify(values(ev.target))});location.reload()}catch(ex){msg(ex.message,true)}}}else location.reload()}catch(ex){msg(ex.message,true)}};try{me=await api('me');$('auth').style.display='none';$('app').style.display='block';$('who').textContent='Đăng nhập: '+me.username+' · Vai trò: '+me.role;const tabs=[['booking','Booking'],['agents','Đại lý'],['tickets','Loại vé'],['reports','Báo cáo']];if(me.role==='admin')tabs.push(['users','Nhân viên'],['audit','Nhật ký']);$('nav').innerHTML=tabs.map(([id,label])=>`<button id="tab-${id}" onclick="show('${id}')">${label}</button>`).join('');show('booking')}catch{}}
async function show(tab){window.currentTab=tab;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.id==='tab-'+tab));try{if(tab==='booking'){const rows=await api('bookings');agents=await api('agents');tickets=await api('tickets');$('page').innerHTML=`<div class="card"><h2>Booking</h2><p class="muted">Giá vốn lấy từ bảng giá theo ngày. Giá bán đại lý lấy từ bảng giá đại lý; khách lẻ nhập giá bán.</p>${['admin','manager','seller'].includes(me.role)?`<form id="createbooking"><label>Ngày<input type="date" name="book_date" value="${today()}" required></label><label>Đại lý<select name="agent_id"><option value="">Khách lẻ</option>${agents.filter(a=>a.active).map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label><label>Tên khách lẻ<input name="customer_name"></label><label>Loại vé<select name="ticket_id" required>${tickets.filter(t=>t.active).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></label><label>Số lượng<input name="quantity" type="number" value="1" min="1" required></label><label>Giá bán khách lẻ<input name="sale_unit" type="number" min="0" placeholder="Chỉ khách lẻ"></label><button>Tạo booking</button></form>`:''}<div class="scroll"><table><tr><th>Mã</th><th>Ngày</th><th>Đại lý / Khách</th><th>Vé</th><th>SL</th><th>Giá bán</th><th>Tổng</th><th>Đã thu</th><th>Còn nợ</th><th>Thanh toán</th></tr>${rows.map(b=>`<tr><td>${esc(b.code)}</td><td>${b.book_date}</td><td>${esc(b.agent_name||b.customer_name)}</td><td>${esc(b.ticket_name_snapshot)}</td><td>${b.quantity}</td><td>${money(b.sale_unit)}</td><td>${money(b.quantity*b.sale_unit)}</td><td>${money(b.received)}</td><td>${money(b.quantity*b.sale_unit-b.received)}</td><td>${['admin','manager','accountant'].includes(me.role)&&b.quantity*b.sale_unit>b.received?`<button onclick="pay(${b.id},${b.quantity*b.sale_unit-b.received})">Thu tiền</button>`:''}</td></tr>`).join('')}</table></div></div>`;const f=$('createbooking');if(f)f.onsubmit=async e=>{e.preventDefault();const v=values(f);v.agent_id=v.agent_id?Number(v.agent_id):null;v.ticket_id=Number(v.ticket_id);v.quantity=Number(v.quantity);v.sale_unit=v.sale_unit===''?null:Number(v.sale_unit);await send('bookings',v)}}
if(tab==='agents'){agents=await api('agents');$('page').innerHTML=`<div class="card"><h2>Đại lý</h2>${['admin','manager'].includes(me.role)?`<form id="addagent"><label>Mã<input name="code" required></label><label>Tên<input name="name" required></label><label>Số điện thoại<input name="phone"></label><button>Thêm đại lý</button></form>`:''}<table><tr><th>Mã</th><th>Tên</th><th>Điện thoại</th><th>Trạng thái</th></tr>${agents.map(a=>`<tr><td>${esc(a.code)}</td><td>${esc(a.name)}</td><td>${esc(a.phone)}</td><td>${a.active?'Hoạt động':'Tạm ngưng'}</td></tr>`).join('')}</table></div>`;if($('addagent'))$('addagent').onsubmit=e=>{e.preventDefault();send('agents',values(e.target))}}
if(tab==='tickets'){tickets=await api('tickets');$('page').innerHTML=`<div class="card"><h2>Loại vé</h2>${['admin','manager'].includes(me.role)?`<form id="addticket"><label>Mã<input name="code" required></label><label>Tên<input name="name" required></label><button>Thêm loại vé</button></form>`:''}<table><tr><th>Mã</th><th>Tên</th></tr>${tickets.map(t=>`<tr><td>${esc(t.code)}</td><td>${esc(t.name)}</td></tr>`).join('')}</table></div>`;if($('addticket'))$('addticket').onsubmit=e=>{e.preventDefault();send('tickets',values(e.target))}}
if(tab==='reports'){$('page').innerHTML='<div class="card"><h2>Tổng quan tài chính</h2><div id="stats" class="stats"></div></div>';if(me.role==='seller')$('stats').textContent='Không có quyền xem báo cáo tài chính.';else{const d=await api('dashboard');$('stats').innerHTML=Object.entries({"Doanh thu booking":d.revenue,"Giá vốn booking":d.cost,"Đã thu":d.received,"Khách còn nợ":d.receivable}).map(([k,v])=>`<div>${k}<b>${money(v)}</b></div>`).join('')}}
if(tab==='users'){const users=await api('users');$('page').innerHTML=`<div class="card"><h2>Quản trị nhân viên</h2><form id="adduser"><label>Tên đăng nhập<input name="username" required></label><label>Mật khẩu (≥12 ký tự)<input name="password" type="password" minlength="12" required></label><label>Vai trò<select name="role"><option value="seller">Bán vé</option><option value="accountant">Kế toán</option><option value="manager">Quản lý</option><option value="admin">Quản trị</option></select></label><button>Tạo nhân viên</button></form><table><tr><th>Tên</th><th>Vai trò</th><th>Hoạt động</th></tr>${users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td>${u.active?'Có':'Không'}</td></tr>`).join('')}</table></div>`;$('adduser').onsubmit=e=>{e.preventDefault();send('users',values(e.target))}}
if(tab==='audit'){const a=await api('audit');$('page').innerHTML=`<div class="card"><h2>Nhật ký thao tác</h2><table><tr><th>Thời gian</th><th>Nhân viên ID</th><th>Hành động</th><th>Đối tượng</th></tr>${a.map(x=>`<tr><td>${esc(x.at)}</td><td>${x.user_id}</td><td>${esc(x.action)}</td><td>${esc(x.entity)} #${esc(x.entity_id)}</td></tr>`).join('')}</table></div>`}
}catch(e){msg(e.message,true)}}
async function pay(id,max){const amount=prompt('Số tiền nhận (tối đa '+money(max)+'):',max);if(amount===null)return;const n=Number(amount);if(!Number.isInteger(n)||n<=0||n>max)return msg('Số tiền không hợp lệ',true);await send('bookings/'+id+'/payments',{amount:n,paid_on:today(),note:''})}async function logout(){await api('logout',{method:'POST'});location.reload()}boot();
</script></html>
